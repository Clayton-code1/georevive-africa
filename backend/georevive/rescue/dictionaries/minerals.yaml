# Commodities and minerals. Canonical -> variants (whole words; case-insensitive, except chemical
# symbols of 1-2 letters such as Au or Cu, which must match case exactly to avoid false positives).
commodities:
  gold: ["gold", "auriferous", "Au"]
  silver: ["silver", "Ag"]
  copper: ["copper", "Cu"]
  nickel: ["nickel", "Ni"]
  chromite: ["chromite", "chrome", "chromium", "Cr"]
  antimony: ["antimony", "stibnite", "Sb"]
  arsenic: ["arsenic", "arsenopyrite", "mispickel"]
  tungsten: ["tungsten", "scheelite", "wolfram", "wolframite"]
  tin: ["tin", "cassiterite", "Sn"]
  lithium: ["lithium", "lepidolite", "petalite", "spodumene", "Li"]
  iron: ["iron ore", "magnetite", "hematite", "haematite"]
  asbestos: ["asbestos", "chrysotile"]
  platinum: ["platinum", "PGM", "PGE", "Pt"]
  lead: ["lead", "Pb"]
  zinc: ["zinc", "sphalerite", "blende", "Zn"]
  magnesite: ["magnesite"]
  limestone: ["limestone", "marble"]
  emerald: ["emerald", "beryl"]
  cobalt: ["cobalt"]  # not "Co": it matches "& Co." (Company) in old texts
  bismuth: ["bismuth"]
  molybdenum: ["molybdenum", "molybdenite"]
  manganese: ["manganese", "pyrolusite"]
  graphite: ["graphite"]
  tantalum: ["tantalum", "tantalite", "columbite"]
  fluorite: ["fluorite", "fluorspar"]
minerals:
  pyrite: ["pyrite", "pyrites", "iron pyrites"]
  pyrrhotite: ["pyrrhotite"]
  chalcopyrite: ["chalcopyrite"]
  arsenopyrite: ["arsenopyrite", "mispickel"]
  galena: ["galena"]
  sphalerite: ["sphalerite", "zinc blende"]
  stibnite: ["stibnite"]
  scheelite: ["scheelite"]
  tourmaline: ["tourmaline", "schorl"]
  sericite: ["sericite", "sericitic", "sericitisation", "sericitization"]
  carbonate: ["ankerite", "siderite", "dolomite", "carbonatisation", "carbonatization", "carbonate alteration"]
  chlorite: ["chlorite", "chloritisation", "chloritization"]
  quartz: ["quartz"]
  magnetite: ["magnetite"]
  hematite: ["hematite", "haematite", "specularite"]
  limonite: ["limonite", "goethite", "gossan", "gossans"]
  fuchsite: ["fuchsite", "chrome mica"]
  malachite: ["malachite"]
  azurite: ["azurite"]
  bornite: ["bornite"]
  telluride: ["telluride", "tellurides", "calaverite"]
structures:
  fault: ["fault", "faults", "faulted", "faulting"]
  shear zone: ["shear zone", "shear zones", "sheared", "shearing", "shear"]
  fold: ["anticline", "syncline", "fold", "folds", "folded"]
  contact: ["contact", "contacts", "granite contact"]
  dyke: ["dyke", "dykes", "dike", "dikes"]
  lineament: ["lineament", "lineaments"]
